name: Daily Project Report

on:
  schedule:
    # GitHub Actions cron 은 UTC 기준. 08:00 KST = 23:00 UTC (전날)
    - cron: "11 0 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send reports
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # 회사 메일이 Google Workspace 가 아니면 아래 두 줄도 Secrets 로 지정
          # SMTP_HOST: ${{ secrets.SMTP_HOST }}
          # SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_BRYAN: ${{ secrets.MAIL_BRYAN }}
          MAIL_ERIC: ${{ secrets.MAIL_ERIC }}
          MAIL_ALEX: ${{ secrets.MAIL_ALEX }}
          MAIL_MICHAEL: ${{ secrets.MAIL_MICHAEL }}
          MAIL_HAILEY: ${{ secrets.MAIL_HAILEY }}
          MAIL_TRISHA: ${{ secrets.MAIL_TRISHA }}
          MAIL_CALVIN: ${{ secrets.MAIL_CALVIN }}
          MAIL_JASON: ${{ secrets.MAIL_JASON }}
        run: python send_reports.py --send
